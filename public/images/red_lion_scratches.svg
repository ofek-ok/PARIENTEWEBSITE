<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="redScratchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a1a"/>
      <stop offset="50%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#990008"/>
    </linearGradient>
    <filter id="scratchGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ff1805" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#scratchGlow)">
    <!-- Claw Mark 1 -->
    <path d="M 60,20 Q 95,90 140,280 C 130,260 110,180 80,100 C 65,60 55,30 60,20 Z" fill="url(#redScratchGrad)" opacity="0.95"/>
    <!-- Claw Mark 2 -->
    <path d="M 130,10 Q 170,100 230,290 C 215,265 190,170 155,90 C 140,50 128,20 130,10 Z" fill="url(#redScratchGrad)"/>
    <!-- Claw Mark 3 -->
    <path d="M 210,15 Q 255,105 315,285 C 300,260 270,175 235,95 C 220,55 208,25 210,15 Z" fill="url(#redScratchGrad)" opacity="0.95"/>
    <!-- Claw Mark 4 (Smaller side scratch) -->
    <path d="M 285,30 Q 325,115 375,270 C 362,250 338,170 308,100 C 295,65 284,40 285,30 Z" fill="url(#redScratchGrad)" opacity="0.85"/>
  </g>
</svg>
